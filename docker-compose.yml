services:
  # Service 1: Database MySQL 
  db:
    image: mysql:8.0
    container_name: pos_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-laravel}
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - pos_network
      - db_network
    # Healthcheck Database
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Rotasi Log
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Service 2: Backend Laravel (FrankenPHP) (Soal 4 & 6)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos_backend
    restart: always
    environment:
      APP_ENV: local
      APP_KEY: base64:v5y3m8B1K9xN8w4F9/Z4G1w6m3d8y2m1K9xN8w4F9/Z=
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
    
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: root
      DB_PASSWORD: secret
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pos_network
    # Healthcheck Backend ke endpoint /api/health
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Rotasi Log
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Service 3: Frontend Vue (Soal 6)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pos_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - pos_network
    # Rotasi Log
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named Volume untuk DB Data
volumes:
  dbdata:
    driver: local

# Network khusus antar container
networks:
  pos_network:
    driver: bridge
  db_network:
    driver: bridge
    internal: true